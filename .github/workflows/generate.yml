name: Generate lesson days

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day id to try (existing days are skipped)"
        required: false
        default: "1"
      count:
        description: "How many days to generate this run"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate lessons
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 generate_lessons.py \
            --start "${{ github.event.inputs.start || '1' }}" \
            --count "${{ github.event.inputs.count || '3' }}"

      - name: Commit new days
        run: |
          git config user.name "deutschstudio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add days review manifest.json
          if git diff --cached --quiet; then
            echo "No new lessons this run."
          else
            git commit -m "Add generated lesson days ($(date -u +%Y-%m-%d))"
            git push
          fi
